name: Bars de Paris (construction)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bars-paris
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Vérifier les adresses et chercher les photos libres
        run: node build-bars-paris.js

      - name: Enregistrer le résultat
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add data/bars-paris.json data/bars-test
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Bars de Paris (construction) (automatique)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              echo "Nouvel essai ($i)"; sleep 20
            done
            exit 1
          fi
