name: Soirées et concerts (Shotgun)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: split-data
  cancel-in-progress: false

jobs:
  shotgun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les soirées Shotgun
        env:
          SHOTGUN_KEY: ${{ secrets.SHOTGUN_KEY }}
        run: node shotgun-sync.js

      - name: Découper les données par ville
        run: node split-data.js

      - name: Enregistrer les fichiers
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add shotgun-report.txt data; [ -f shotgun-events.json ] && git add shotgun-events.json || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer"
          else
            git commit -m "Soirées Shotgun (automatique)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Relancer la publication du site
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
