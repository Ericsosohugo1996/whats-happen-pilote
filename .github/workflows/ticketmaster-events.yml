name: Concerts et soirées (Ticketmaster)

on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: split-data
  cancel-in-progress: false

jobs:
  ticketmaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les concerts et soirées
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: node ticketmaster-sync.js

      - name: Découper les données par ville
        run: node split-data.js

      - name: Enregistrer les fichiers
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add ticketmaster-events.json ticketmaster-report.txt data
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer"
          else
            git commit -m "Concerts et soirées Ticketmaster (automatique)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Relancer la publication du site
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
