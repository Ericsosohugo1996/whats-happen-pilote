name: Découper les données par ville

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - datatourisme-events.json
      - datatourisme-places.json
      - osm-bars.json
      - split-data.js
      - .github/workflows/split-data.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: split-data
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Découper les données par ville
        run: node split-data.js

      - name: Enregistrer les fichiers
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer"
          else
            git commit -m "Données par ville (automatique)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Relancer la publication du site
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
