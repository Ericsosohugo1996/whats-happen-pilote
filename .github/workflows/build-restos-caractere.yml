name: Adresses de caractère (construction)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restos-caractere
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Construire la sélection d'adresses de caractère
        env:
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
        run: node build-restos-caractere.js

      - name: Enregistrer le compte rendu
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add data/restos-caractere.json data/restos-test
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Adresses de caractère (construction) (automatique)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
