name: Photos des organisateurs

on:
     workflow_dispatch:
     schedule:
       - cron: "20 6 * * *" 

permissions:
  contents: write
  pages: write

concurrency:
  group: split-data
  cancel-in-progress: false

jobs:
  organisateurs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Chercher les images de partage des organisateurs
        run: node og-photos.js

      - name: Mettre les photos dans les fichiers par ville
        run: node split-data.js

      - name: Enregistrer
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add og-photos.json data
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer"
          else
            git commit -m "Photos des organisateurs (automatique)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Relancer la publication du site
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
