name: Concerts et soirées (OpenAgenda)

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: split-data
  cancel-in-progress: false

jobs:
  openagenda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les événements OpenAgenda
        env:
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
        run: node openagenda-sync.js

      - name: Découper les données par ville
        run: node split-data.js

      - name: Enregistrer les fichiers
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add openagenda-events.json openagenda-events-report.txt data
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer"
          else
            git commit -m "Concerts et soirées OpenAgenda (automatique)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Relancer la publication du site
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
