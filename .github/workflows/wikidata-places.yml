name: Lieux à ne pas manquer (Wikidata)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 1 * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: wikidata
  cancel-in-progress: false

jobs:
  lieux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Interroger Wikidata pour chaque ville
        run: node wikidata-places.js

      - name: Enregistrer
        run: |
          git config user.name "whazup-bot"
          git config user.email "bot@whazup.fr"
          git add data/wikidata
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer"
          else
            git commit -m "Lieux à ne pas manquer (automatique)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Relancer la publication du site
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
