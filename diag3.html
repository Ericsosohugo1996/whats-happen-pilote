<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesure des rangées</title>
<style>body{font:13px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:12px;background:#0e1730;color:#fff}h1{font-size:18px}pre{white-space:pre-wrap;word-break:break-all;background:#16224a;padding:8px;border-radius:10px;font-size:11.5px}iframe{width:100%;height:470px;border:2px solid #E85D3D;border-radius:12px;background:#fff}</style></head><body>
<h1>Mesure des rangées</h1><p>Ne touche à rien pendant 25 secondes. Fais ensuite 2 captures : une du haut de cette page (cadre + début du texte), une de la suite en faisant défiler.</p>
<iframe id="f" src="/"></iframe><pre id="o">…</pre>
<script>
var o=document.getElementById("o"),f=document.getElementById("f");
function R(e){var r=e.getBoundingClientRect();return Math.round(r.left)+","+Math.round(r.top)+" "+Math.round(r.width)+"x"+Math.round(r.height)}
function S(e,p){var c=f.contentWindow.getComputedStyle(e);return p.map(function(k){return k+"="+c[k]}).join(" ")}
setTimeout(function(){try{var d=f.contentDocument,w=f.contentWindow,L=[];
L.push("fenêtre du cadre : "+w.innerWidth+"x"+w.innerHeight+" | navigateur : "+navigator.userAgent.slice(25,100));
var row=d.querySelector('#wz-rows [data-row="tonight"]');if(!row){o.textContent="rangée Ce soir absente";return}
var s=row.querySelector(".wzr-s"),cs=s.querySelectorAll(".wzr-c");
L.push("rangée : "+R(row)+" | bande : "+R(s)+" scrollW="+s.scrollWidth+" clientW="+s.clientWidth+" scrollLeft="+s.scrollLeft);
L.push("bande : "+S(s,["display","overflowX","overflowY","width","position","transform","opacity","visibility","scrollSnapType"]));
L.push("parent de la rangée : "+S(row.parentNode,["display","overflow","width"])+" ; rangée : "+S(row,["display","overflow","width","contain","contentVisibility"]));
for(var i=0;i<4&&i<cs.length;i++){var c=cs[i],im=c.querySelector("img");L.push("carte "+(i+1)+" : "+R(c)+" | "+S(c,["display","opacity","visibility","flexBasis","width"])+" | image "+R(im)+" complete="+im.complete+" nat="+im.naturalWidth+" | "+(c.querySelector(".wzr-t")||{}).textContent)}
L.push("nombre de cartes : "+cs.length);
o.textContent=L.join("\n\n")}catch(e){o.textContent="erreur : "+e.message}},25000);
</script></body></html>
