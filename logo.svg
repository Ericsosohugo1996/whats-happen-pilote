      <stop offset="55%" stop-color="#ffb15e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb15e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd9a0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="88" fill="url(#bgWarm)"/>

  <circle cx="200" cy="180" r="150" fill="url(#glow)"/>

  <g fill="#ffe6b0" opacity="0.9">
    <circle cx="88" cy="110" r="4"/>
    <circle cx="320" cy="95" r="3"/>
    <circle cx="335" cy="230" r="4"/>
    <circle cx="70" cy="255" r="3"/>
    <path d="M110 300 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" opacity="0.85"/>
  </g>

  <circle cx="200" cy="175" r="98" fill="none" stroke="url(#ringWarm)" stroke-width="5" opacity="0.4"/>
  <circle cx="200" cy="175" r="78" fill="none" stroke="url(#ringWarm)" stroke-width="5" opacity="0.7"/>

  <defs>
    <linearGradient id="wGradRelief" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e07fab"/>
      <stop offset="45%" stop-color="#a8336b"/>
      <stop offset="100%" stop-color="#6e1f47"/>
    </linearGradient>
    <filter id="wShadow" x="-30%" y="-30%" width="160%" height="160%">
