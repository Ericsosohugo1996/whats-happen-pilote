<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1955"/>
      <stop offset="45%" stop-color="#a8336b"/>
      <stop offset="75%" stop-color="#f4713f"/>
      <stop offset="100%" stop-color="#ffbd4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
